name: USMSB SDK Tests

on:
  push:
    branches: [ master, main, feature/** ]
  pull_request:
    branches: [ master, main ]

env:
  PYTHON_VERSION: "3.14"

jobs:
  economic-safety:
    name: Economic fail-closed contracts (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -e ".[test]"
      - name: Verify uncertain reviews, persistent settlement and disabled placeholder ZK
        run: >-
          python -m pytest
          tests/unit/test_economic_fail_closed.py
          tests/unit/test_pea_market.py
          tests/unit/test_joint_order.py
          tests/unit/test_team_leader_pea.py
          tests/unit/test_vibe_settlement.py
          tests/unit/test_a2a_runtime.py
          tests/creative_economy/test_services.py -q

  portable-autonomy:
    name: Portable autonomy and open-core contracts (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The portable learning adapter imports the existing Pydantic-backed
      # ExperienceLoop; keep this focused gate's runtime dependency explicit.
      - run: python -m pip install pytest 'pydantic>=2.0,<3' build setuptools wheel ruff
      - run: python -m pytest tests/portable --confcutdir=tests/portable -q
      - name: Lint new open-core mechanisms
        run: >-
          python -m ruff check --no-cache
          src/usmsb_sdk/autonomy/journal.py
          src/usmsb_sdk/autonomy/profiles.py
          src/usmsb_sdk/autonomy/interop.py
          src/usmsb_sdk/autonomy/migration.py
          scripts/build_core_distribution.py
          scripts/check_collaboration_resilience.py
          tests/portable/test_open_core.py
          tests/portable/test_journal_adversarial.py
          tests/portable/test_core_distribution.py
          tests/portable/test_host_interop.py
          tests/portable/test_journal_migration.py
          tests/portable/test_collaboration_resilience.py
          examples/open_collaboration/host.py

  core-distribution:
    name: Independent core distribution (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install build setuptools wheel twine
      - name: Build without installing the full SDK
        run: python scripts/build_core_distribution.py
      - name: Check core metadata
        run: python -m twine check dist/core/*
      - uses: actions/upload-artifact@v4
        with:
          name: independent-usmsb-core
          path: dist/core/*
          retention-days: 7

  lint:
    name: Legacy repository lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff
        run: ruff check src/ tests/
        continue-on-error: true

      - name: Check formatting with Black
        run: black --check src/ tests/
        continue-on-error: true

      - name: Check imports with isort
        run: isort --check-only src/ tests/
        continue-on-error: true

      - name: Explain incremental blocking policy
        run: |
          echo "The repository-wide lint backlog remains visible above."
          echo "Billing-sensitive new code is enforced by the focused blocking contract jobs."

  llm-telemetry-contract:
    name: LLM telemetry and artifact contract (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This focused release gate does not depend on the repository-wide lint
    # backlog. Billing-sensitive contracts remain blocking while legacy lint
    # debt stays visible as an advisory job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK and focused contract dependencies
        run: |
          python -m pip install --upgrade pip
          # The focused suite imports the pinned OpenHarness 0.1.9 runtime;
          # installing only ``test`` made the release contract silently
          # depend on a developer machine having an undeclared extra.
          python -m pip install -e ".[test,openharness]" ruff

      - name: Run physical telemetry, artifact, Harness and replay contracts
        run: |
          python scripts/check_python314_baseline.py
          python scripts/check_llm_provider_bypasses.py
          python -m pytest -p no:cacheprovider \
            tests/unit/test_llm_provider_telemetry.py \
            tests/unit/test_openai_adapter_telemetry.py \
            tests/unit/test_glm_adapter_telemetry.py \
            tests/unit/test_llm_artifact_spool.py \
            tests/unit/test_openharness_physical_telemetry.py \
            tests/unit/test_openharness_019_contract.py \
            tests/unit/test_meta_agent_provider_replay_policy.py \
            -q

      - name: Check focused telemetry sources
        run: |
          python -m compileall -q \
            src/usmsb_sdk/llm_telemetry.py \
            src/usmsb_sdk/llm_artifacts.py \
            src/usmsb_sdk/openharness_telemetry.py
          ruff check --no-cache \
            src/usmsb_sdk/llm_telemetry.py \
            src/usmsb_sdk/llm_artifacts.py \
            src/usmsb_sdk/openharness_telemetry.py \
            tests/unit/test_llm_provider_telemetry.py \
            tests/unit/test_openai_adapter_telemetry.py \
            tests/unit/test_glm_adapter_telemetry.py \
            tests/unit/test_llm_artifact_spool.py \
            tests/unit/test_openharness_physical_telemetry.py \
            tests/unit/test_meta_agent_provider_replay_policy.py

  dist-inference-contract:
    name: Dist inference telemetry contract (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This gate is deliberately independent from the repository-wide lint job.
    # The existing lint baseline remains visible, while the real vLLM
    # physical-attempt boundary cannot be skipped by that legacy backlog.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK and lightweight dist-inference test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio httpx aiosqlite ruff

      - name: Run physical-attempt telemetry and single-shot router contracts
        working-directory: dist-inference
        run: |
          python -m pytest -p no:cacheprovider \
            tests/test_llm_physical_telemetry.py \
            tests/test_router.py \
            tests/test_gpu_pool.py \
            -q

      - name: Check focused dist-inference telemetry sources
        working-directory: dist-inference
        run: |
          python -m compileall -q \
            shared/llm_telemetry_contract.py \
            node_executor/vllm_engine.py
          ruff check --no-cache \
            shared/llm_telemetry_contract.py \
            node_executor/vllm_engine.py \
            tests/test_llm_physical_telemetry.py \
            tests/test_router.py
          ruff check --no-cache --select E9,F821 \
            shared/types.py \
            global_scheduler/gpu_pool.py \
            tests/test_gpu_pool.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,openharness]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v \
            --tb=short \
            --cov=src/usmsb_sdk \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow and not requires_llm and not requires_network"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests (blocking)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,openharness]"

      # Offline/local integrations now block. Excluded external prerequisites
      # remain explicit; a green gate is not real multi-party certification.
      - name: Run local integration contracts (blocking)
        id: integration-contracts
        run: |
          pytest tests/integration tests/agent_protocol/integration -v \
            --ignore=tests/agent_protocol/integration/test_end_to_end.py \
            --tb=short \
            --timeout=60 \
            -m "not slow and not requires_llm and not requires_network" \
            --junitxml=integration-contracts.xml

      - name: Report integration evidence
        if: always()
        run: |
          echo "Integration outcome: ${{ steps.integration-contracts.outcome }} (blocking; inspect JUnit for skipped external prerequisites)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-contract-evidence
          path: integration-contracts.xml
          if-no-files-found: warn

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Run mypy
        run: |
          mypy src/usmsb_sdk --ignore-missing-imports || true
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - economic-safety
      - portable-autonomy
      - core-distribution
      - lint
      - llm-telemetry-contract
      - dist-inference-contract
      - unit-tests
      - integration-tests
      - type-check
      - build
    if: always()
    steps:
      - name: Check status
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Economic Safety | ${{ needs['economic-safety'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Portable / Open Core | ${{ needs['portable-autonomy'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core Distribution | ${{ needs['core-distribution'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Telemetry Contract | ${{ needs['llm-telemetry-contract'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dist Inference Contract | ${{ needs['dist-inference-contract'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration (blocking; inspect JUnit) | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: >-
          needs['economic-safety'].result != 'success' ||
          needs['portable-autonomy'].result != 'success' ||
          needs['core-distribution'].result != 'success' ||
          needs.lint.result != 'success' ||
          needs['llm-telemetry-contract'].result != 'success' ||
          needs['dist-inference-contract'].result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs['integration-tests'].result != 'success' ||
          needs.build.result != 'success'
        run: exit 1
