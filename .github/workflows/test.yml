name: USMSB SDK Tests

on:
  push:
    branches: [ master, main, feature/** ]
  pull_request:
    branches: [ master, main ]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Legacy repository lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff
        run: ruff check src/ tests/
        continue-on-error: true

      - name: Check formatting with Black
        run: black --check src/ tests/
        continue-on-error: true

      - name: Check imports with isort
        run: isort --check-only src/ tests/
        continue-on-error: true

      - name: Explain incremental blocking policy
        run: |
          echo "The repository-wide lint backlog remains visible above."
          echo "Billing-sensitive new code is enforced by the focused blocking contract jobs."

  llm-telemetry-contract:
    name: LLM telemetry and artifact contract (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This focused release gate does not depend on the repository-wide lint
    # backlog. Billing-sensitive contracts remain blocking while legacy lint
    # debt stays visible as an advisory job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK and focused contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ruff

      - name: Run physical telemetry, artifact, Harness and replay contracts
        run: |
          python scripts/check_python314_baseline.py
          python scripts/check_llm_provider_bypasses.py
          python -m pytest -p no:cacheprovider \
            tests/unit/test_llm_provider_telemetry.py \
            tests/unit/test_openai_adapter_telemetry.py \
            tests/unit/test_glm_adapter_telemetry.py \
            tests/unit/test_llm_artifact_spool.py \
            tests/unit/test_openharness_physical_telemetry.py \
            tests/unit/test_meta_agent_provider_replay_policy.py \
            -q

      - name: Check focused telemetry sources
        run: |
          python -m compileall -q \
            src/usmsb_sdk/llm_telemetry.py \
            src/usmsb_sdk/llm_artifacts.py \
            src/usmsb_sdk/openharness_telemetry.py
          ruff check --no-cache \
            src/usmsb_sdk/llm_telemetry.py \
            src/usmsb_sdk/llm_artifacts.py \
            src/usmsb_sdk/openharness_telemetry.py \
            tests/unit/test_llm_provider_telemetry.py \
            tests/unit/test_openai_adapter_telemetry.py \
            tests/unit/test_glm_adapter_telemetry.py \
            tests/unit/test_llm_artifact_spool.py \
            tests/unit/test_openharness_physical_telemetry.py \
            tests/unit/test_meta_agent_provider_replay_policy.py

  dist-inference-contract:
    name: Dist inference telemetry contract (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This gate is deliberately independent from the repository-wide lint job.
    # The existing lint baseline remains visible, while the real vLLM
    # physical-attempt boundary cannot be skipped by that legacy backlog.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK and lightweight dist-inference test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio httpx aiosqlite ruff

      - name: Run physical-attempt telemetry and single-shot router contracts
        working-directory: dist-inference
        run: |
          python -m pytest -p no:cacheprovider \
            tests/test_llm_physical_telemetry.py \
            tests/test_router.py \
            tests/test_gpu_pool.py \
            -q

      - name: Check focused dist-inference telemetry sources
        working-directory: dist-inference
        run: |
          python -m compileall -q \
            shared/llm_telemetry_contract.py \
            node_executor/vllm_engine.py
          ruff check --no-cache \
            shared/llm_telemetry_contract.py \
            node_executor/vllm_engine.py \
            tests/test_llm_physical_telemetry.py \
            tests/test_router.py
          ruff check --no-cache --select E9,F821 \
            shared/types.py \
            global_scheduler/gpu_pool.py \
            tests/test_gpu_pool.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v \
            --tb=short \
            --cov=src/usmsb_sdk \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow and not requires_llm and not requires_network"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run integration tests
        run: |
          pytest tests/integration tests/agent_protocol/integration -v \
            --tb=short \
            -m "not slow and not requires_llm and not requires_network" \
            || echo "Some integration tests may require external services"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Run mypy
        run: |
          mypy src/usmsb_sdk --ignore-missing-imports || true
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - llm-telemetry-contract
      - dist-inference-contract
      - unit-tests
      - integration-tests
      - type-check
      - build
    if: always()
    steps:
      - name: Check status
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Telemetry Contract | ${{ needs['llm-telemetry-contract'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dist Inference Contract | ${{ needs['dist-inference-contract'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: >-
          needs.lint.result != 'success' ||
          needs['llm-telemetry-contract'].result != 'success' ||
          needs['dist-inference-contract'].result != 'success' ||
          needs.unit-tests.result != 'success'
        run: exit 1
